# Reconstruye y publica el sitio en GitHub Pages:
#  - en cada push a main
#  - cada lunes de madrugada (las tablas de "próximos 12 meses" avanzan solas)
#  - a mano desde la pestaña Actions
name: Construir y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir
        run: node build.js
        env:
          # Configura estas variables en Settings → Secrets and variables → Actions → Variables
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          CNAME: ${{ vars.CNAME }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub pausa las tareas programadas de repos sin actividad en 60 días.
      # Un commit mínimo semanal mantiene el repositorio activo sin que tengas que hacer nada.
      - name: Mantener el repositorio activo
        if: github.event_name == 'schedule'
        run: |
          date -u +%F > .last-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-build
          git commit -m "Reconstrucción semanal [skip ci]" || exit 0
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
